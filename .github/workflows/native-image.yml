name: Publish native image

on:
  push:
    branches:
      - main
      - feature/native-image
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native executable
        # Spring AOT/native evaluates @ConditionalOnProperty at BUILD time, so the
        # Kafka event publisher (orderbook.events.kafka.enabled) must be enabled here,
        # otherwise the no-op publisher is baked into the native executable and the
        # runtime env var on Render has no effect.
        env:
          KAFKA_EVENTS_ENABLED: 'true'
        run: mvn -B -Pnative -DskipTests native:compile

      - name: Copy the executable to the build context
        run: cp target/order-book ./order-book

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=native
            type=sha,prefix=native-sha-

      - name: Build and push the native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.native
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trigger the Render production deploy
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not configured: skipping the production deploy."
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}"
