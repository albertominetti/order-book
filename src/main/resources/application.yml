# In-memory order book / matching engine demo
spring:
  application:
    name: order-book
  jackson:
    # Keep the JSON payload stable and readable: null fields are omitted.
    # Jackson 3 (the Boot 4 default) already writes dates and times as
    # ISO-8601 strings, so WRITE_DATES_AS_TIMESTAMPS needs no configuration.
    default-property-inclusion: non_null
  mvc:
    # Log only the mapped requests, not the resolved resources
    log-resolved-exception: false
  kafka:
    # Empty by default: with no broker the app still runs and no connection is attempted.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  # Reads the port provided by the platform (Render sets PORT), falling back to 8080 locally.
  port: ${PORT:8080}

logging:
  level:
    org.springframework.web: INFO

# OpenAPI 3 / Swagger UI (springdoc-openapi)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# Market events: optional Kafka publication of order/trade events.
# Disabled by default; with no broker configured the app publishes nothing and never connects.
orderbook:
  events:
    kafka:
      enabled: ${KAFKA_EVENTS_ENABLED:false}
      topic: ${KAFKA_EVENTS_TOPIC:order-events}
