# Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Two free web services:
# - albertos-order-book:         production, runs the prebuilt GraalVM native image from GHCR.
# - albertos-order-book-preview: preview, BUILT from the `preview` branch (root Dockerfile), so any
#   commit pushed or merged into `preview` is deployed for testing before it reaches `main`.
#
# NOTE: the GHCR package must be PUBLIC for Render to pull the native image anonymously. If it is
# PRIVATE, add a registry credential in Render (Workspace Settings) and reference it via `image.creds`.

services:
  - type: web
    name: albertos-order-book
    runtime: image
    image:
      url: ghcr.io/albertominetti/order-book:native
    plan: free
    region: frankfurt
    healthCheckPath: /api/instruments

  - type: web
    name: albertos-order-book-preview
    runtime: docker
    branch: preview
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/instruments
